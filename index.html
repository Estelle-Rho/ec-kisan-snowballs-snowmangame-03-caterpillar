<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roll, Roll, Snowman! · Caterpillar Class</title>
<style>
:root{--navy:#1F3A5F;--blue:#4A90C2;--red:#D9483B;--yellow:#F2B84B;--green:#6BAA3B;--snow:#F4F8FC;--ink:#1F2A37}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",Calibri,sans-serif;background:linear-gradient(180deg,#CFE4F5 0%,var(--snow) 75%);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{font-family:Cambria,Georgia,serif;font-size:clamp(20px,2.6vw,32px)}
header .sub{font-size:clamp(11px,1.1vw,14px);opacity:.85}
.steps{display:flex;gap:8px}
.steps span{font-size:clamp(20px,2.4vw,30px);opacity:.3;transition:.3s;filter:grayscale(1)}
.steps span.on{opacity:1;filter:none;transform:scale(1.15)}
.steps span.done{opacity:.8;filter:none}
main{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,60px);padding:10px 16px;min-height:0}
@media(max-width:899px){main{flex-direction:column;gap:6px}}
.stage{position:relative;height:min(68vh,560px);aspect-ratio:3/4;max-width:92vw}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ball{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .6s cubic-bezier(.3,1.7,.5,1)}
.ball.on{transform:scale(1)}
#face{opacity:0;transition:opacity .4s .3s}
#face.on{opacity:1}
#body{transform-origin:50% 92%;transition:transform 3s ease-in,opacity 3s}
.melting #body{transform:scaleY(.06) scaleX(1.3);opacity:.2}
#puddle{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);transition:transform 3s ease-in}
.melting #puddle{transform:scale(1)}
.deco{position:absolute;transform:translate(-50%,-50%) scale(0);line-height:1;transition:transform .6s cubic-bezier(.3,1.7,.5,1),top 2.6s ease-in,opacity 2.6s;pointer-events:none}
.deco.on{transform:translate(-50%,-50%) scale(1)}
.melting .deco.on{top:94%!important;opacity:0}
.sunbig{position:absolute;top:-6%;right:-10%;font-size:clamp(60px,9vh,110px);opacity:0;transform:scale(.3) rotate(-40deg);transition:1s}
.melting .sunbig{opacity:1;transform:scale(1)}
.bye{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);font-family:Cambria,Georgia,serif;font-size:clamp(26px,4vh,44px);font-weight:700;color:var(--navy);white-space:nowrap;opacity:0;transition:opacity .8s 2.8s}
.melting .bye{opacity:1}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:min(340px,90vw)}
.big-btn{border:none;background:#fff;border-radius:50%;width:clamp(150px,24vh,230px);height:clamp(150px,24vh,230px);font-size:clamp(84px,14vh,140px);line-height:1;cursor:pointer;box-shadow:0 10px 24px rgba(31,58,95,.18),inset 0 -8px 0 rgba(0,0,0,.05);display:grid;place-items:center;animation:pulse 1.4s infinite}
.big-btn:active{transform:scale(.93)}
.big-btn.hide{display:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.big-btn.wiggle{animation:wiggle .5s}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.word{font-family:Cambria,Georgia,serif;font-size:clamp(40px,7vh,72px);font-weight:700;color:var(--red);min-height:1.2em;text-align:center;cursor:pointer}
.word.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.tap{font-size:clamp(16px,2.2vh,22px);color:var(--navy);font-weight:700}
.again{border:none;border-radius:999px;background:var(--green);color:#fff;font-size:clamp(20px,3vh,28px);font-weight:700;padding:14px 34px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);display:none}
.parent{background:#FFF6E3;border-top:3px solid var(--yellow);padding:10px 16px;font-size:clamp(13px,1.7vh,17px);color:#5c4a22;text-align:center;line-height:1.45}
.parent b{color:var(--red)}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;font-size:30px;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
</style></head>
<body>
<header>
  <div><h1>⛄ Roll, Roll, Snowman!</h1><div class="sub">🐛 Caterpillar Class · Snowballs Day 3 · 에릭칼아트잉글리쉬 동탄기산</div></div>
  <div class="steps"><span id="st0">❄️</span><span id="st1">🛍️</span><span id="st2">☀️</span></div>
</header>
<main>
  <div class="stage" id="stage">
    <svg viewBox="0 0 300 400" aria-hidden="true">
      <ellipse id="puddle" cx="150" cy="372" rx="135" ry="24" fill="#9CCBEA" opacity=".85"/>
      <g id="body">
        <circle class="ball" id="b0" cx="150" cy="300" r="80" fill="#fff" stroke="#BFD6EA" stroke-width="4"/>
        <circle class="ball" id="b1" cx="150" cy="182" r="60" fill="#fff" stroke="#BFD6EA" stroke-width="4"/>
        <circle class="ball" id="b2" cx="150" cy="88" r="46" fill="#fff" stroke="#BFD6EA" stroke-width="4"/>
        <g id="face">
          <circle cx="134" cy="80" r="6" fill="#1F2A37"/><circle cx="166" cy="80" r="6" fill="#1F2A37"/>
          <path d="M130 106 Q150 120 170 106" stroke="#1F2A37" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
    <div id="decos"></div>
    <div class="sunbig">☀️</div>
    <div class="bye">Bye-bye, snowman! 👋</div>
    <div class="stars" id="stars"></div>
  </div>
  <div class="side">
    <div class="word" id="word"></div>
    <button class="big-btn" id="btn" aria-label="누르기">❄️</button>
    <div class="tap" id="tap">Tap! 눌러 보세요</div>
    <button class="again" id="again">↺ Again!</button>
  </div>
</main>
<div class="parent" id="parent"></div>
<script>
let audioCtx,unlocked=false;
function unlockAudio(){if(unlocked)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const b=audioCtx.createBuffer(1,1,22050);const s=audioCtx.createBufferSource();s.buffer=b;s.connect(audioCtx.destination);s.start(0);audioCtx.resume();unlocked=true;}catch(e){}}
document.addEventListener('touchstart',unlockAudio,{once:true});document.addEventListener('click',unlockAudio,{once:true});
function speak(t){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
function chime(up){try{if(!audioCtx)return;audioCtx.resume();const notes=up?[523,659,784]:[784,659,523];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audioCtx.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+i*.09+.35);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+i*.09);o.stop(audioCtx.currentTime+i*.09+.4);});}catch(e){}}

const SACK='<svg viewBox="0 0 200 220" style="width:70%;height:auto"><path d="M70 60 Q30 110 32 160 Q34 210 100 212 Q166 210 168 160 Q170 110 130 60 Z" fill="#C8955C" stroke="#8A5A2B" stroke-width="5"/><path d="M62 30 Q100 52 138 30 L130 62 Q100 72 70 62 Z" fill="#B9844C" stroke="#8A5A2B" stroke-width="5" stroke-linejoin="round"/><path d="M66 62 Q100 74 134 62" stroke="#D9483B" stroke-width="9" fill="none" stroke-linecap="round"/><text x="100" y="155" text-anchor="middle" font-size="48" font-family="Cambria,Georgia,serif" font-weight="700" fill="#6B4320">?</text></svg>';
const $=id=>document.getElementById(id);
// front-view carrot nose: cone pointing at the viewer (shaded base, ridges, bright tip)
const NOSE=`<svg viewBox="0 0 100 100" style="width:1em;height:1em;display:block;overflow:visible">
<defs>
<clipPath id="noseHull"><circle cx="50" cy="50" r="30"/><path d="M50 80 L80 52 L84 84 Z"/></clipPath>
<linearGradient id="noseBody" x1=".15" y1=".1" x2=".85" y2=".95"><stop offset="0" stop-color="#FFC27A"/><stop offset=".35" stop-color="#FF8D24"/><stop offset=".7" stop-color="#E0600C"/><stop offset="1" stop-color="#9A3B07"/></linearGradient>
<radialGradient id="noseShadow" cx="50%" cy="50%" r="50%"><stop offset=".45" stop-color="#1F3A5F" stop-opacity=".3"/><stop offset="1" stop-color="#1F3A5F" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="62" cy="66" rx="36" ry="30" fill="url(#noseShadow)"/>
<ellipse cx="86" cy="88" rx="7" ry="4.5" fill="#1F3A5F" opacity=".16"/>
<g clip-path="url(#noseHull)">
<rect width="100" height="100" fill="url(#noseBody)"/>
<g fill="none" stroke="#8A3405" stroke-opacity=".42" stroke-width="2.3" stroke-dasharray="11 8" stroke-linecap="round">
<circle cx="83" cy="82" r="13"/><circle cx="83" cy="82" r="24"/><circle cx="83" cy="82" r="36"/><circle cx="83" cy="82" r="48"/>
</g>
<path d="M28 42 Q40 24 60 28" stroke="#fff" stroke-opacity=".6" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M60 30 Q72 42 80 74" stroke="#FFE0B8" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>
<circle cx="50" cy="50" r="30" fill="none" stroke="#B24A0A" stroke-opacity=".25" stroke-width="1.5"/>
<circle cx="81.5" cy="80.5" r="3" fill="#B44708"/>
</svg>`;
const ITEMS=[
  {em:'🎩',word:'Hat!',say:'Hat!',x:50,y:8,size:1.5},
  {em:'🥕',svg:NOSE,word:'Nose!',say:'Nose!',x:50,y:23,size:.62},
  {em:'🔘',word:'Buttons!',say:'Buttons!',multi:[[50,41],[50,45.5],[50,50]],size:.325}
];
const PARENT=[
  '👐 아이 손을 잡고 <b>눈덩이를 함께 눌러</b> 주세요. 누를 때마다 손을 굴리며 <b>"Roll, roll!"</b> 같이 말해요.',
  '🎒 자루를 누르면 물건이 나와요. 단어를 <b>한 번만 따라 말해도 충분</b>해요. 손가락으로 눈사람에 붙은 곳을 가리켜 주세요.',
  '☀️ 해님을 누르면 눈사람이 녹아요. 손을 흔들며 <b>"Bye-bye, snowman!"</b> 함께 인사해요.',
  '🎉 잘했어요! 하이파이브 하고 <b>"Again!"</b>으로 한 번 더 해도 좋아요.'
];
let phase=0,count=0,busy=false;

function setPhase(p){
  phase=p;count=0;
  ['st0','st1','st2'].forEach((id,i)=>{$(id).className=i<p?'done':(i===p?'on':'');});
  $('parent').innerHTML=PARENT[Math.min(p,3)];
  const b=$('btn');
  if(p===0){b.textContent='❄️';$('tap').textContent='Tap! 눈덩이를 눌러요';}
  if(p===1){b.innerHTML=SACK;$('tap').textContent='Tap! 자루를 눌러요';}
  if(p===2){b.textContent='☀️';$('tap').textContent='Tap! 해님을 눌러요';}
  b.classList.toggle('hide',p>=3);$('tap').style.display=p>=3?'none':'';$('again').style.display=p>=3?'inline-block':'none';
}
function showWord(w){const e=$('word');e.textContent=w;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');e.onclick=()=>speak(w);}
function burst(){const s=$('stars');for(let i=0;i<12;i++){const e=document.createElement('div');e.className='star';e.textContent=['✨','❄️','⭐'][i%3];e.style.left='50%';e.style.top='45%';e.style.setProperty('--dx',(Math.random()*300-150)+'px');e.style.setProperty('--dy',(Math.random()*300-150)+'px');s.appendChild(e);setTimeout(()=>e.remove(),1100);}}
function buildDecos(){
  const d=$('decos');d.innerHTML='';
  ITEMS.forEach((it,i)=>(it.multi||[[it.x,it.y]]).forEach(([x,y])=>{const e=document.createElement('div');e.className='deco';e.dataset.i=i;if(it.svg){e.innerHTML=it.svg;e.style.width=e.style.height='1em';}else e.textContent=it.em;e.style.left=x+'%';e.style.top=y+'%';e.style.fontSize=`calc(min(68vh,560px)*0.09*${it.size})`;d.appendChild(e);}));
}
function tap(){
  if(busy)return;busy=true;setTimeout(()=>busy=false,900);
  const b=$('btn');b.classList.remove('wiggle');void b.offsetWidth;b.classList.add('wiggle');
  if(phase===0){
    $('b'+count).classList.add('on');chime(true);
    count++;
    if(count<3){showWord('Roll, roll!');speak('Roll, roll, roll!');}
    else{$('face').classList.add('on');showWord('Snowman!');speak('Snowman!');burst();setTimeout(()=>setPhase(1),1200);}
  }else if(phase===1){
    const it=ITEMS[count];
    document.querySelectorAll(`.deco[data-i="${count}"]`).forEach(e=>e.classList.add('on'));
    showWord(it.word);speak(it.say);chime(true);
    count++;
    if(count>=ITEMS.length){setTimeout(()=>{burst();showWord('Yay!');speak('Yay! Look at my snowman!');},1100);setTimeout(()=>setPhase(2),2600);}
  }else if(phase===2){
    $('stage').classList.add('melting');showWord('Hot! Hot!');speak('Hot! Hot! Oh no, it melts!');chime(false);
    $('btn').classList.add('hide');$('tap').style.display='none';
    setTimeout(()=>{showWord('Bye-bye!');speak('Bye-bye, snowman!');},3000);
    setTimeout(()=>setPhase(3),4200);
  }
}
function reset(){
  speechSynthesis.cancel();
  $('stage').classList.remove('melting');
  ['b0','b1','b2'].forEach(id=>$(id).classList.remove('on'));$('face').classList.remove('on');
  buildDecos();$('word').textContent='';setPhase(0);
}
$('btn').onclick=tap;
$('again').onclick=reset;
$('stage').onclick=()=>{if(phase>=1&&phase<3)speak('Snowman!');};
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();phase>=3?reset():tap();}
  else if(e.key==='r'||e.key==='R')reset();
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}
});
reset();
</script>
</body></html>
